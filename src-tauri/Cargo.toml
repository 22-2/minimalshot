[package]
name = "minimashot"
version = "0.0.3"
description = "A screenshot tool that does as little as possible"
edition = "2021"
license = "MIT"

[lib]
name = "minimashot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9"
arboard = "3"
thiserror = "2"
tauri-plugin-dialog = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"

# fat LTO と codegen-units = 1 は CI でのビルドに数分かかる割に、この規模では差が小さいため使わない
[profile.release]
lto = "thin"
strip = true
