name: Release

on:
  push:
    tags: ["v*", "!v0.0.0-dev"]
  # タグを push できない環境からでもリリースできるよう、手動実行ではタグを作成する
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

# CI は main への push（PR のマージ）で既に通っているので、ここではビルドと公開だけを行う
jobs:
  release:
    name: Build and publish exe
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # リリースビルドは CI（debug）と成果物が別物なので、専用のキーで依存のビルド結果を持ち回す
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
      - run: pnpm install --frozen-lockfile
      # インストーラーは作らず、フロントエンドを埋め込んだ単体の exe だけをビルドする
      - run: pnpm tauri build --no-bundle
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="MinimalShot_${VERSION}_x64.exe"
          cp src-tauri/target/release/minimalshot.exe "$asset"
          gh release create "$VERSION" "$asset" \
            --target "$GITHUB_SHA" \
            --title "MinimalShot $VERSION" \
            --notes "Windows 用の実行ファイルです。インストール不要で、そのまま起動できます（WebView2 ランタイムが必要です。Windows 10/11 には標準で入っています）。" \
            --prerelease
